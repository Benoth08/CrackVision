<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Architecture MLOps de CrackVision</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <style>
      .zone { fill: #f4f3ef; stroke: #e1e0d9; stroke-width: 1.5; }
      .zone-title { font-size: 15px; font-weight: 700; fill: #0b0b0b; }
      .box { fill: #ffffff; stroke: #c3c2b7; stroke-width: 1.5; }
      .svc { fill: #ffffff; stroke: #2a78d6; stroke-width: 1.8; }
      .name { font-size: 14px; font-weight: 600; fill: #0b0b0b; }
      .sub { font-size: 12px; fill: #52514e; }
      .tiny { font-size: 11px; fill: #898781; }
      .flow { stroke: #52514e; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .flow-req { stroke: #2a78d6; stroke-width: 1.8; fill: none; marker-end: url(#arrow-blue); }
      .dash { stroke-dasharray: 6 4; }
    </style>
  </defs>
  <rect width="1200" height="700" fill="#fcfcfb"/>

  <!-- Zone donnees et entrainement -->
  <rect class="zone" x="20" y="20" width="560" height="660" rx="12"/>
  <text class="zone-title" x="40" y="50">Données et entraînement</text>

  <rect class="box" x="40" y="70" width="200" height="64" rx="8"/>
  <text class="name" x="56" y="96">Mendeley Data</text>
  <text class="sub" x="56" y="116">458 photos + masques</text>
  <text class="tiny" x="56" y="129">SHA-256 vérifiée</text>

  <rect class="svc" x="300" y="70" width="260" height="96" rx="8"/>
  <text class="name" x="316" y="96">Airflow 3</text>
  <text class="sub" x="316" y="116">DAG crackvision_training</text>
  <text class="sub" x="316" y="134">DAG crackvision_drift_monitoring</text>
  <text class="tiny" x="316" y="154">api-server · scheduler · dag-processor</text>

  <rect class="svc" x="40" y="200" width="520" height="300" rx="8"/>
  <text class="name" x="56" y="226">Conteneur trainer (DockerOperator) : pipeline DVC</text>
  <g class="sub">
    <text x="64" y="256">1. ingest → index → split (stratifié par photo)</text>
    <text x="64" y="280">2. tile@train · tile@val · tile@blind_test (scellé, SHA-256)</text>
    <text x="64" y="304">3. balance : repeat factor sampling + 50 % fissurées</text>
  </g>
  <rect x="64" y="322" width="150" height="56" rx="6" fill="#eaf2fc" stroke="#2a78d6"/>
  <text class="name" x="78" y="346">YOLOX-s</text>
  <text class="sub" x="78" y="366">supervisé</text>
  <rect x="226" y="322" width="150" height="56" rx="6" fill="#fdeee7" stroke="#eb6834"/>
  <text class="name" x="240" y="346">Autoencodeur</text>
  <text class="sub" x="240" y="366">tuiles saines</text>
  <rect x="388" y="322" width="150" height="56" rx="6" fill="#e6f6ef" stroke="#1baf7a"/>
  <text class="name" x="402" y="346">Hybride</text>
  <text class="sub" x="402" y="366">calibré sur val</text>
  <g class="sub">
    <text x="64" y="404">4. calibrate : seuils + fusion (validation croisée par photo)</text>
    <text x="64" y="428">5. evaluate@val · evaluate@blind_test (IC 95 % bootstrap)</text>
    <text x="64" y="452">6. publish : runs, registre, alias champion / challenger</text>
  </g>
  <text class="tiny" x="64" y="482">Même code en CPU (tests de fumée) ou en GPU (machine distante)</text>

  <rect class="box" x="40" y="540" width="240" height="64" rx="8"/>
  <text class="name" x="56" y="566">Remote DVC</text>
  <text class="sub" x="56" y="586">données et modèles versionnés</text>

  <rect class="svc" x="320" y="540" width="240" height="120" rx="8"/>
  <text class="name" x="336" y="566">MLflow 3.4</text>
  <text class="sub" x="336" y="586">suivi des expériences</text>
  <text class="sub" x="336" y="606">registre : alias champion</text>
  <text class="tiny" x="336" y="628">PostgreSQL + artefacts servis</text>
  <text class="tiny" x="336" y="644">/mlflow/</text>

  <path class="flow" d="M140,134 L140,198"/>
  <path class="flow" d="M430,166 L430,198"/>
  <path class="flow" d="M160,500 L160,538"/>
  <path class="flow" d="M440,500 L440,538"/>

  <!-- Zone service -->
  <rect class="zone" x="620" y="20" width="560" height="380" rx="12"/>
  <text class="zone-title" x="640" y="50">Service d'inférence</text>

  <rect class="box" x="640" y="70" width="150" height="64" rx="8"/>
  <text class="name" x="656" y="96">Inspecteur</text>
  <text class="sub" x="656" y="116">photo de béton</text>

  <rect class="svc" x="840" y="70" width="320" height="80" rx="8"/>
  <text class="name" x="856" y="96">nginx (port 8090)</text>
  <text class="sub" x="856" y="116">/ · /api/ · /mlflow/ · /grafana/ · /prometheus/</text>
  <text class="tiny" x="856" y="136">limite de débit, /api/metrics et /api/admin fermés</text>

  <rect class="svc" x="840" y="190" width="320" height="190" rx="8"/>
  <text class="name" x="856" y="216">API FastAPI</text>
  <g class="sub">
    <text x="856" y="240">POST /predict?model=yolox | autoencoder | hybrid</text>
    <text x="856" y="262">tuiles 512 px → recomposition → métrologie</text>
    <text x="856" y="284">GET /health · /ready · /models · /metrics</text>
    <text x="856" y="306">POST /admin/reload (jeton)</text>
  </g>
  <text class="tiny" x="856" y="332">charge le modèle hybride « champion »</text>
  <text class="tiny" x="856" y="348">(YOLOX + autoencodeur + fusion, trio cohérent)</text>
  <text class="tiny" x="856" y="364">repli : dossier models/ produit par DVC</text>

  <path class="flow-req" d="M790,102 L838,102"/>
  <path class="flow-req" d="M1000,150 L1000,188"/>
  <path class="flow dash" d="M838,330 C700,330 640,560 562,600"/>
  <text class="tiny" x="645" y="388">téléchargement du champion</text>

  <!-- Zone surveillance -->
  <rect class="zone" x="620" y="420" width="560" height="260" rx="12"/>
  <text class="zone-title" x="640" y="450">Surveillance</text>

  <rect class="svc" x="640" y="470" width="240" height="96" rx="8"/>
  <text class="name" x="656" y="496">Prometheus</text>
  <text class="sub" x="656" y="516">API + nginx-exporter</text>
  <text class="sub" x="656" y="536">alertes : panne, latence,</text>
  <text class="sub" x="656" y="554">erreurs, dérive</text>

  <rect class="svc" x="920" y="470" width="240" height="96" rx="8"/>
  <text class="name" x="936" y="496">Grafana</text>
  <text class="sub" x="936" y="516">trafic, latence, décisions,</text>
  <text class="sub" x="936" y="536">score d'anomalie (dérive),</text>
  <text class="sub" x="936" y="554">luminosité des entrées</text>

  <path class="flow" d="M1000,380 L1000,420 L760,420 L760,468"/>
  <text class="tiny" x="1008" y="410">/metrics</text>
  <path class="flow" d="M882,518 L918,518"/>
  <path class="flow dash" d="M640,540 C600,520 600,160 562,130"/>
  <text class="tiny" x="590" y="610" transform="rotate(-90 590 610)">requêtes de dérive (horaire)</text>

  <text class="tiny" x="640" y="600">Dérive sans étiquette : score d'anomalie centré-réduit sur le béton sain</text>
  <text class="tiny" x="640" y="616">de validation ; moyenne &gt; 2 sur 6 h → alerte, réentraînement en option.</text>
</svg>
