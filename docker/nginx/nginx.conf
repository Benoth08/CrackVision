# =============================================================================
# nginx : point d'entree unique de CrackVision (port 8090 par defaut)
#   /             interface web de demonstration
#   /api/         API FastAPI (limitation de debit sur /api/predict)
#   /mlflow/      MLflow (suivi + registre)
#   /grafana/     tableaux de bord
#   /prometheus/  Prometheus
# /api/metrics et /api/admin/ ne sont pas exposes : Prometheus et Airflow
# joignent l'API directement sur le reseau interne.
# Les amonts sont resolus a la demande (resolveur Docker) : nginx demarre meme
# si un service optionnel est arrete, et repond 502 pour celui-ci seulement.
# =============================================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    client_max_body_size 25m;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;
    limit_req_zone $binary_remote_addr zone=predict:10m rate=5r/s;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;

        set $api        http://api:8000;
        set $mlflow     http://mlflow:5000;
        set $grafana    http://grafana:3000;
        set $prometheus http://prometheus:9090;

        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
        location /static/ {
            root /usr/share/nginx/html;
        }

        location = /api/metrics { return 403; }
        location /api/admin/    { return 403; }

        location /api/predict {
            limit_req zone=predict burst=20 nodelay;
            proxy_read_timeout 180s;
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
        }
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass $api;
        }

        location /mlflow/ {
            proxy_read_timeout 300s;
            proxy_pass $mlflow;
        }

        location /grafana/ {
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_pass $grafana;
        }

        location /prometheus/ {
            proxy_pass $prometheus;
        }
    }

    # Statistiques nginx pour l'exportateur Prometheus (reseau interne uniquement)
    server {
        listen 8080;
        location = /stub_status {
            stub_status;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }
    }
}
