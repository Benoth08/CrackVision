# Regles d'alerte de CrackVision (visibles dans Prometheus > Alerts et dans Grafana).
groups:
  - name: crackvision-service
    rules:
      - alert: CrackVisionApiIndisponible
        expr: up{job="crackvision-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "L'API CrackVision ne repond plus depuis 2 minutes"

      - alert: CrackVisionModelesNonCharges
        expr: crackvision_model_ready == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "L'API tourne mais aucun modele n'est charge (registre MLflow injoignable ?)"

      - alert: CrackVisionLatenceElevee
        expr: |
          histogram_quantile(0.95,
            sum by (le, model) (rate(crackvision_request_latency_seconds_bucket[5m]))) > 8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Latence p95 superieure a 8 s pour le modele {{ $labels.model }}"

      - alert: CrackVisionErreursServeur
        expr: |
          sum(rate(crackvision_requests_total{endpoint="/predict",status=~"5.."}[5m]))
            / clamp_min(sum(rate(crackvision_requests_total{endpoint="/predict"}[5m])), 1e-9) > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Plus de 5 % des predictions echouent (erreurs 5xx)"

  - name: crackvision-derive
    rules:
      - alert: CrackVisionDeriveScoreAnomalie
        # Score moyen centre-reduit sur le beton sain de validation (jauges de
        # reference publiees par l'API) : au-dela de 2 de facon durable, les images
        # ne ressemblent plus aux donnees d'entrainement.
        expr: |
          (
            sum(rate(crackvision_anomaly_score_sum[6h]))
              / clamp_min(sum(rate(crackvision_anomaly_score_count[6h])), 1e-9)
            - scalar(max(crackvision_anomaly_reference{stat="mean"}))
          ) / scalar(max(crackvision_anomaly_reference{stat="std"})) > 2
          and sum(increase(crackvision_anomaly_score_count[6h])) > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Derive des entrees : score d'anomalie moyen eleve sur 6 h"

      - alert: CrackVisionDeriveLuminosite
        expr: |
          (sum(rate(crackvision_input_brightness_sum[6h]))
            / clamp_min(sum(rate(crackvision_input_brightness_count[6h])), 1e-9) < 60)
          and sum(increase(crackvision_input_brightness_count[6h])) > 50
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Images anormalement sombres sur 6 h (eclairage, camera)"
